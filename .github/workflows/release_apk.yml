name: Release APK

# Workflow ini build APK release untuk private testing.
#
# Trigger:
#  - Manual via "Run workflow" button (workflow_dispatch)
#  - Push tag dengan format `v*` (mis. v0.1.0) → otomatis create GitHub Release
#
# Output:
#  - APK ter-attach sebagai artifact di run page (selalu, untuk semua trigger)
#  - APK ter-attach ke GitHub Release (hanya saat trigger tag)
#
# Catatan signing:
#  - Saat ini APK dibuild dengan **debug signing** (fallback di
#    android/app/build.gradle.kts kalau key.properties tidak ada).
#  - Cocok untuk private testing internal (install via "Unknown sources").
#  - **TIDAK BOLEH** untuk distribusi publik atau Play Store.
#  - Production signing akan di-setup terpisah saat siap publish.

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Catatan rilis (opsional, akan masuk ke deskripsi artifact)"
        required: false
        default: "Manual private testing build"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.x
          cache: true

      - name: Show versions
        run: |
          flutter --version
          java -version

      - name: Pub get
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK (debug-signed fallback)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build split-per-ABI APKs
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Compute version & artifact name
        id: meta
        run: |
          VERSION_NAME=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          SHORT_SHA=${GITHUB_SHA::7}
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            ARTIFACT_NAME="hikeid-${TAG}"
          else
            ARTIFACT_NAME="hikeid-${VERSION_NAME}-${SHORT_SHA}"
          fi
          echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Stage APKs
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
             artifacts/${{ steps.meta.outputs.artifact_name }}-universal.apk
          # Split-per-ABI APKs (lebih kecil per device)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            if [ -f "${src}" ]; then
              cp "${src}" "artifacts/${{ steps.meta.outputs.artifact_name }}-${abi}.apk"
            fi
          done
          ls -lh artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
          prerelease: true
          body: |
            ## Hike.id ${{ github.ref_name }}

            APK private testing build (debug-signed).

            **Cara install:**
            1. Download `*-universal.apk` (cocok untuk semua device).
            2. Di Android, izinkan "Install dari sumber tidak dikenal".
            3. Buka file, ikuti prompt instalasi.

            **Catatan:**
            - Build ini menggunakan debug signing key — TIDAK COCOK untuk publik.
            - Untuk hemat ukuran, pilih APK split sesuai arsitektur device:
              `arm64-v8a` (mayoritas device modern), `armeabi-v7a` (device lama),
              `x86_64` (emulator).
            - Lihat `RELEASE_CHECKLIST.md` & `KNOWN_LIMITATIONS.md` untuk
              daftar yang sudah/belum bisa dites.
